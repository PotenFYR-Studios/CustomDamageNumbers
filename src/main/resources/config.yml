#
# ==========================================================
#                 CustomDamageNumbers Config
# ==========================================================
#
# Packet-based floating damage numbers plugin
# optimized for modern Paper/Spigot servers.
#
# Recommended:
# - Paper 26.3
# - Java 25
# - PacketEvents 2.14+
#
# ==========================================================

general:

  # Enable or disable the plugin completely
  enabled: true

  # Enable verbose debug logging
  debug: false

  # Maximum distance players can see damage numbers
  # Lower values improve performance on large servers
  view-distance: 32

  # Worlds where damage numbers are disabled
  disabled-worlds:
    - example_world

  # Ignore invisible entities
  ignore-invisible-entities: true

  # Ignore armor stands
  ignore-armor-stands: true

  # Ignore NPCs from plugins like Citizens
  ignore-npcs: true

  # Show numbers for mobs
  mobs: true

  # Show numbers for players
  players: true

  # Show numbers for animals
  animals: true

  # Show self damage
  self-damage: true

  # Send packets only to nearby viewers
  nearby-viewers-only: true

  # Maximum active damage displays globally
  # Prevents packet spam during mob farms
  max-active-displays: 2000

  # Destroy orphaned displays automatically
  cleanup-orphans: true

# ==========================================================
# Animation Settings
# ==========================================================

animation:

  # Duration before disappearing
  duration-ticks: 30

  # Vertical movement speed
  vertical-speed: 0.03

  # Random side movement
  horizontal-randomness: 0.20

  # Enable scaling animation
  scale-animation: true

  # Start scale
  start-scale: 1.3

  # End scale
  end-scale: 0.8

  # Enable fade-out animation
  fade-out: true

  # Add bounce effect
  bounce: true

  # Enable slight rotation movement
  rotation: false

  # Random spawn spread
  random-offset: true

# ==========================================================
# Damage Merge System
# ==========================================================

merge-system:

  # Merge rapid hits into one number
  enabled: true

  # Time window for hit merging
  # Lower = more responsive
  merge-window-ms: 150

  # Maximum merged damage
  max-merged-damage: 9999

  # Merge same attacker hits only
  same-attacker-only: true

# ==========================================================
# Critical Hits
# ==========================================================

critical-hits:

  enabled: true

  # Larger scale for critical hits
  scale-multiplier: 1.5

  # Add special symbol
  symbol: "✧"

  # Enable bold formatting
  bold: true

  # Enable sound effect
  sound: true

  # Critical hit sound
  sound-type: ENTITY_PLAYER_ATTACK_CRIT

  # Volume
  volume: 1.0

  # Pitch
  pitch: 1.2

# ==========================================================
# Damage Styles
# ==========================================================

styles:

  #
  # Supported formatting:
  #
  # {damage} = damage value
  # {symbol} = damage symbol
  #
  # MiniMessage supported
  #

  normal:

    enabled: true

    format: "{damage}"

    color: "#FFFFFF"

    bold: true

    italic: false

    shadow: true

  critical:

    enabled: true

    format: "✧ {damage}"

    color: "#FF3333"

    bold: true

    italic: false

    shadow: true

  fire:

    enabled: true

    format: "🔥 {damage}"

    color: "#FF9900"

  poison:

    enabled: true

    format: "☠ {damage}"

    color: "#00FF66"

  magic:

    enabled: true

    format: "✦ {damage}"

    color: "#CC66FF"

  explosion:

    enabled: true

    format: "💥 {damage}"

    color: "#FFFF00"

  healing:

    enabled: true

    format: "+{damage}"

    color: "#00FF99"

  fall:

    enabled: true

    format: "{damage}"

    color: "#AAAAAA"

# ==========================================================
# Particles
# ==========================================================

particles:

  enabled: true

  critical:

    enabled: true

    particle: CRIT

    amount: 8

  fire:

    enabled: true

    particle: FLAME

    amount: 6

  poison:

    enabled: true

    particle: SPELL_MOB

    amount: 5

# ==========================================================
# Performance Settings
# ==========================================================

performance:

  # Send packets asynchronously when possible
  async-packets: true

  # Update packets every X ticks
  # Lower = smoother animations
  animation-interval: 1

  # Maximum displays per player
  max-per-player: 50

  # Batch packet sends
  packet-batching: true

  # Batch size
  batch-size: 20

  # Enable packet compression optimization
  optimize-packets: true

  # Skip updates if player is too far
  distance-culling: true

# ==========================================================
# Integrations
# ==========================================================

integrations:

  luckperms: true

  placeholderapi: false

  mythicmobs: false

  mmoitems: false

  oraxen: false

  itemsadder: false

# ==========================================================
# Permissions
# ==========================================================

permissions:

  # Permission required to see damage numbers
  require-view-permission: false

  view-permission: "cdn.view"

  # Permission required to use styles
  style-permissions: true

# ==========================================================
# Advanced
# ==========================================================

advanced:

  # Entity ID start range
  entity-id-start: 500000

  # Remove displays instantly on death
  remove-on-death: true

  # Ignore fake damage events
  ignore-zero-damage: true

  # Enable packet debug
  packet-debug: false

  # Folia compatibility mode
  folia-mode: false