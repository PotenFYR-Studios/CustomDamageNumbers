name: CustomDamageNumbers

version: '${project.version}'

main: in.potenfyr.cdn.CustomDamageNumbersPlugin

description: Packet-based floating damage numbers rendered as client-side text displays.

api-version: '26.3'

authors:
  - Potenfyr

depend:
  - packetevents

softdepend:
  - LuckPerms
  - ProtocolLib
  - ProtocolSupport
  - ViaVersion
  - ViaBackwards
  - ViaRewind
  - Geyser-Spigot

commands:

  cdn:
    description: CustomDamageNumbers admin command
    aliases:
      - damage
      - damagedisplay

permissions:

  cdn.reload:
    description: Allows reloading the CDN configuration
    default: op

  cdn.test:
    description: Allows spawning a test damage display
    default: op

  cdn.view:
    description: Allows seeing damage numbers (only enforced when require-view-permission is true)
    default: true

  cdn.style.fortnite:
    description: Selects the Fortnite style behavior
    default: true

  cdn.style.mmo:
    description: Selects the MMO style behavior
    default: false