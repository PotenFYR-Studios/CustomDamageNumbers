#
# ==========================================================
#        CustomDamageNumbers Animation Presets
# ==========================================================
#
# A preset is a complete animation. Choose one in config.yml:
#
#   animation:
#     preset: default
#
# Any key written in config.yml's `animation` section overrides that single
# value of the chosen preset, so you can tune one number without copying the
# whole preset here. Keys the preset omits fall back to the built-in defaults.
#
# Every preset supports three groups of options:
#
#   movement  the current animation options (duration, rise, scale, fade,
#             bounce, rotation, follow, ...)
#   position  where the number sits, relative to the entity's feet
#   offset    the random spawn offset that keeps stacked hits readable
#
# /cdn reload applies changes live. Add your own presets as new top-level
# sections (lowercase names) and select them in config.yml.
# ==========================================================

default:

  # ---- movement ----
  duration-ticks: 30
  rise-ticks: 10
  vertical-speed: 0.08
  horizontal-randomness: 0.20
  scale-animation: true
  start-scale: 1.3
  end-scale: 0.8
  fade-out: true
  fade-start: 0.6
  bounce: true
  bounce-strength: 0.35
  rotation: false
  rotation-speed: 0.10
  follow-entity: true
  follow-smoothing: 0.35
  critical-scale-multiplier: 1.5

  # ---- position: where the number sits, relative to the entity's feet ----
  position:
    x: 0.0
    y: 1.8
    z: 0.0

  # ---- offset: random spawn offset so stacked hits stay readable ----
  offset:
    random: true
    spread: 0.20

subtle:

  # Small, quick and quiet: numbers stay close to the hit point.
  duration-ticks: 20
  rise-ticks: 6
  vertical-speed: 0.05
  horizontal-randomness: 0.08
  scale-animation: true
  start-scale: 1.1
  end-scale: 0.9
  fade-out: true
  fade-start: 0.7
  bounce: false
  follow-entity: true
  follow-smoothing: 0.5

  position:
    x: 0.0
    y: 2.1
    z: 0.0

  offset:
    random: false
    spread: 0.0

explosive:

  # Big pop, long hang time, heavy bounce; numbers detach from the victim.
  duration-ticks: 45
  rise-ticks: 12
  vertical-speed: 0.14
  horizontal-randomness: 0.45
  scale-animation: true
  start-scale: 1.8
  end-scale: 0.7
  fade-out: true
  fade-start: 0.5
  bounce: true
  bounce-strength: 0.6
  follow-entity: false

  position:
    x: 0.0
    y: 1.4
    z: 0.0

  offset:
    random: true
    spread: 0.50

orbit:

  # Numbers circle the victim as they rise and sink.
  duration-ticks: 35
  rise-ticks: 10
  vertical-speed: 0.07
  horizontal-randomness: 0.25
  scale-animation: true
  start-scale: 1.2
  end-scale: 0.9
  fade-out: true
  fade-start: 0.6
  bounce: false
  rotation: true
  rotation-speed: 0.18
  follow-entity: true
  follow-smoothing: 0.35

  position:
    x: 0.0
    y: 1.9
    z: 0.0

  offset:
    random: true
    spread: 0.10
