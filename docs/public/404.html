<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>404 — CustomDamageNumbers</title>
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d14" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      :root {
        color-scheme: dark;
        --line: rgba(139, 92, 246, 0.16);
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #0b0d14;
        color: #b9bfd4;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        text-align: center;
      }
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image: radial-gradient(rgba(139, 92, 246, 0.22) 1px, transparent 1px);
        background-size: 26px 26px;
        -webkit-mask-image: radial-gradient(750px circle at 50% 0%, white, transparent 75%);
        mask-image: radial-gradient(750px circle at 50% 0%, white, transparent 75%);
      }
      .wrap { position: relative; max-width: 520px; }
      img { width: 56px; height: 56px; }
      p.mono {
        margin-top: 18px;
        font-family: ui-monospace, Consolas, monospace;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: #9aa0b4;
      }
      h1 {
        margin-top: 10px;
        font-size: clamp(2em, 6vw, 3em);
        font-weight: 800;
        letter-spacing: -0.02em;
        color: #fff;
      }
      h1 span {
        background: linear-gradient(120deg, #c4b5fd, #f9a8d4 50%, #fdba74);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      p.body { margin-top: 14px; line-height: 1.7; }
      a {
        display: inline-block;
        margin-top: 26px;
        padding: 12px 26px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 0.9em;
        color: #fff;
        text-decoration: none;
        background: linear-gradient(135deg, #8b5cf6, #ec4899 55%, #f97316);
        box-shadow: 0 4px 24px rgba(236, 72, 153, 0.35);
      }
      .links { margin-top: 22px; font-size: 0.82em; }
      .links a {
        display: inline;
        margin: 0 10px;
        padding: 0;
        background: none;
        box-shadow: none;
        color: #c4b5fd;
        font-weight: 500;
      }
      .rule { margin-top: 28px; border-top: 1px solid var(--line); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img src="/favicon.png" alt="" />
      <p class="mono">CustomDamageNumbers · 404</p>
      <h1>That page <span>dealt no damage.</span></h1>
      <p class="body">
        The route you asked for does not exist. The numbers are fine — this one is just missing.
      </p>
      <a href="/">Back to the docs</a>
      <div class="rule"></div>
      <p class="links">
        <a href="/docs">Documentation</a>
        <a href="/examples">Examples</a>
        <a href="/about">About</a>
        <a href="/license">License</a>
      </p>
    </div>
  </body>
</html>
