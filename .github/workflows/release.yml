name: Release

# Publishing model: the plugin version in gradle.properties is permanent (1.0.0).
# Every push to master rebuilds, appends the new commits to a changelog and updates the
# SAME release for that version — assets are replaced (--clobber) and the changelog is
# merged, never overwritten. The v<version> tag is moved to the newest build so the tag
# always points at what the release actually contains.

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:

  release:

    name: Build and publish
    runs-on: ubuntu-latest

    steps:

      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Read the plugin version
        id: version
        run: |
          version="$(grep -E '^version=' gradle.properties | head -1 | cut -d= -f2 | tr -d '[:space:]')"
          if [ -z "$version" ]; then
            echo "::error::no version found in gradle.properties"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing version $version"

      - name: Collect the release jars
        run: |
          mkdir -p release
          cp cdn-modern/build/libs/CustomDamageNumbers-[0-9]*.jar release/ 2>/dev/null || true
          cp cdn-legacy/build/libs/CustomDamageNumbers-Legacy-[0-9]*.jar release/ 2>/dev/null || true
          rm -f release/*-thin.jar release/*-sources.jar release/*-javadoc.jar
          count="$(find release -name '*.jar' | wc -l)"
          echo "Collected $count jar(s):"
          ls -la release
          if [ "$count" -lt 2 ]; then
            echo "::error::expected both the modern and legacy jars"
            exit 1
          fi

      - name: Merge the changelog into the release notes
        env:
          # Required: without a token gh release view fails, the previous body reads as
          # empty and every earlier build section is silently dropped.
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/release_notes.py \
            --version "${{ steps.version.outputs.value }}" \
            --build "${{ github.run_number }}" \
            --sha "${{ github.sha }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --out release-notes.md
          echo "----- release notes -----"
          cat release-notes.md

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          tag="v${VERSION}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Updating the existing release $tag"
            gh release edit "$tag" \
              --title "CustomDamageNumbers ${VERSION}" \
              --notes-file release-notes.md
          else
            echo "Creating release $tag"
            gh release create "$tag" \
              --title "CustomDamageNumbers ${VERSION}" \
              --notes-file release-notes.md \
              --target "$GITHUB_SHA"
          fi

          # Replace the assets in place so the release always carries the newest build.
          gh release upload "$tag" release/*.jar --clobber

          # Keep the tag pointing at the build the release contains.
          git tag -f "$tag" "$GITHUB_SHA"
          git push --force origin "refs/tags/$tag"

      - name: Summary
        run: |
          {
            echo "### CustomDamageNumbers ${{ steps.version.outputs.value }}"
            echo
            echo "Release: \`v${{ steps.version.outputs.value }}\` updated from build ${{ github.run_number }}."
            echo "Assets: modern (1.20.2 - 26.x) and legacy (1.17.x - 1.20.1) jars."
          } >> "$GITHUB_STEP_SUMMARY"
