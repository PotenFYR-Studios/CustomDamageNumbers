# Builds both jars and runs the unit suite on every push and pull request.
# The end-to-end matrix (real servers in Docker) lives in docker/e2e/ and is run
# by hand or on a release, because it needs several minutes per version.
name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - docs/**
      - '**.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:

    name: Build and test
    runs-on: ubuntu-latest

    steps:

      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Check both jars were produced
        run: |
          modern="$(ls -1 cdn-modern/build/libs/CustomDamageNumbers-[0-9]*.jar 2>/dev/null | grep -v -- -thin | head -1)"
          legacy="$(ls -1 cdn-legacy/build/libs/CustomDamageNumbers-Legacy-[0-9]*.jar 2>/dev/null | head -1)"
          if [ -z "$modern" ] || [ -z "$legacy" ]; then
            echo "::error::expected both the modern and the legacy jar"
            exit 1
          fi
          echo "modern: $modern"
          echo "legacy: $legacy"

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: CustomDamageNumbers-jars
          path: |
            cdn-modern/build/libs/CustomDamageNumbers-[0-9]*.jar
            cdn-legacy/build/libs/CustomDamageNumbers-Legacy-[0-9]*.jar
          if-no-files-found: error
